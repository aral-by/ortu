# cargo-deny configuration. Policy source: docs/systemdesign.md, section 16.

[graph]
all-features = true

[advisories]
# Every RUSTSEC advisory fails the build unless it is listed here with a
# justification and an expiry plan.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0 distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allowlist is the project policy, not a snapshot of today's dependency
# tree, so entries that no current dependency uses are expected.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# OpenSSL is not used anywhere: all cryptography comes from RustCrypto.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
