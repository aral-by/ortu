[workspace]
resolver = "3"
members = [
    "crates/ortu-audio",
    "crates/ortu-cli",
    "crates/ortu-core",
    "crates/ortu-crypto",
    "crates/ortu-eval",
    "crates/ortu-normalize",
    "crates/ortu-stream",
    "crates/ortu-tr",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Aral Büyükyanbolu"]
repository = "https://github.com/aral-by/ortu"
homepage = "https://github.com/aral-by/ortu"
keywords = ["pii", "redaction", "turkish", "speech", "privacy"]
categories = ["text-processing", "cryptography"]
# Nothing is published until the crate names are reserved and v0.1 ships
# (docs/systemdesign.md, section 20, open question 1).
publish = false

[workspace.dependencies]
# Internal crates. Versions are pinned to the workspace version so that
# cargo-deny does not treat path dependencies as wildcards.
ortu-audio = { path = "crates/ortu-audio", version = "0.0.0" }
ortu-core = { path = "crates/ortu-core", version = "0.0.0" }
ortu-crypto = { path = "crates/ortu-crypto", version = "0.0.0" }
ortu-eval = { path = "crates/ortu-eval", version = "0.0.0" }
ortu-normalize = { path = "crates/ortu-normalize", version = "0.0.0" }
ortu-stream = { path = "crates/ortu-stream", version = "0.0.0" }
ortu-tr = { path = "crates/ortu-tr", version = "0.0.0" }

# External crates.
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Crate-prefixed type names (OrtuError in ortu-core) read better than the
# alternative and are idiomatic in a multi-crate workspace.
module_name_repetitions = "allow"
# Panicking and debugging shortcuts are not allowed outside tests
# (see .clippy.toml for the test exemptions).
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
# Library crates must not write to stdout/stderr; raw values could leak
# through ad-hoc prints. The CLI opts out explicitly where it needs to.
print_stderr = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
